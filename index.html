<title>AJ STUDIO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap">
<style>
/* Layout: o simulador é o herói — formulário curto à esquerda, celular vivo à direita sobre a esfera da marca. */
:root{
  --bg:#FBF7F2; --surface:#FFFFFF; --ink:#2B2A2E; --mute:#6A6670; --line:#E6DFD6;
  --btn:#2B2A2E; --btn-ink:#FBF7F2; --accent:#7446BF; --danger:#B3261E;
  --a1:#FFA36C; --a2:#F0728F; --a3:#8E5BD0; --a4:#2B2A7C; --device:#1B1A1E;
  --display:"Outfit","Avenir Next","Segoe UI",sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141218; --surface:#1E1B24; --ink:#F4EFE9; --mute:#ABA5B2; --line:#342F3C;
  --btn:#F4EFE9; --btn-ink:#141218; --accent:#BC9AF2; --danger:#FF8A80; --device:#0B0A0D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141218; --surface:#1E1B24; --ink:#F4EFE9; --mute:#ABA5B2; --line:#342F3C;
  --btn:#F4EFE9; --btn-ink:#141218; --accent:#BC9AF2; --danger:#FF8A80; --device:#0B0A0D; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.02em;line-height:1.08}
p{margin:0}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.brand b{display:block;font-family:var(--display);font-weight:500;font-size:1.25rem;letter-spacing:.14em;line-height:1}
.brand small{display:block;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.nav{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.nav a{color:var(--ink);text-decoration:none;font-size:.92rem}
.nav a:hover{color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:999px;padding:13px 24px;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.nav a.btn{color:var(--btn-ink);padding:10px 18px;font-size:.88rem}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:.88rem}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:28px 72px}
.slogan{font-family:var(--display);font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
.hero h1{font-weight:600;font-size:clamp(2.2rem,5.2vw,3.7rem)}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--a1),var(--a2) 45%,var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:var(--mute);font-size:1.08rem;max-width:34em;margin-top:18px}
.builder{margin-top:30px;display:flex;flex-direction:column;gap:22px}
.field label,.legend{display:block;font-weight:600;font-size:.92rem;margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1rem}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field input[type=file]{padding:10px 12px;font-size:.9rem}
.big input{font-size:1.15rem;padding:17px 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:9px 15px;font-size:.92rem;transition:border-color .15s}
.chip:hover{border-color:var(--mute)}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.note{color:var(--mute);font-size:.88rem}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;min-width:0}
.orb{position:absolute;width:min(440px,112%);aspect-ratio:1;border-radius:50%;top:10%;left:50%;transform:translateX(-50%);background:linear-gradient(155deg,var(--a1) 8%,var(--a2) 40%,var(--a3) 68%,var(--a4) 95%);box-shadow:0 40px 60px -30px color-mix(in srgb,var(--a4) 55%,transparent)}
.hint{position:relative;font-size:.85rem;color:var(--mute);text-align:center;max-width:26em}

/* ===== celular ===== */
.phone{position:relative;width:min(320px,100%);aspect-ratio:320/670;background:var(--device);border-radius:48px;padding:10px;box-shadow:0 30px 50px -22px rgba(20,16,40,.55),0 0 0 1px var(--line)}
.screen{position:absolute;inset:10px;--p-line:color-mix(in srgb,var(--p-ink) 13%,transparent);--p-mute:color-mix(in srgb,var(--p-ink) 64%,var(--p-bg));--p-gline:color-mix(in srgb,var(--p-accent) 45%,transparent);border-radius:38px;overflow:hidden;background:var(--p-bg);color:var(--p-ink);display:flex;flex-direction:column;font-family:var(--display);font-size:13px;line-height:1.4;animation:pop .4s ease-out}
@keyframes pop{from{opacity:.2;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stag>*{animation:rise .45s both;animation-delay:calc(var(--i,0)*70ms + .1s)}
.screen button{border:0;background:none;padding:0;color:inherit}
.sbar{display:flex;justify-content:space-between;padding:10px 24px 2px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.phead{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-bottom:1px solid var(--p-line)}
.wm{flex:1;min-width:0;display:flex;align-items:center;gap:8px;color:var(--p-accent)}
.wm b{display:block;font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.wm small{display:block;font-size:8px;letter-spacing:.34em;text-transform:uppercase;margin-top:3px}
.screen .burger{width:30px;height:30px;display:grid;place-items:center}
.pscroll{flex:1;overflow-y:auto;position:relative;scrollbar-width:none;overscroll-behavior:contain}
.pscroll::-webkit-scrollbar,.hsc::-webkit-scrollbar{display:none}
.hsc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}

.hero2{position:relative;min-height:244px;padding:22px 14px 20px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;color:#fff;background-color:var(--p-hbg);background-repeat:no-repeat;overflow:hidden}
.hero2 h4{font-size:28px;line-height:1.02;font-weight:700;margin:0 0 10px;max-width:60%;letter-spacing:-.01em;animation:rise .5s both .1s}
.hero2 h4 span{display:block;color:var(--p-hacc)}
.hero2 p{font-size:11.5px;opacity:.82;max-width:52%;margin-bottom:14px;animation:rise .5s both .2s}
.hero2 .gold{animation:rise .5s both .3s}
.screen .gold{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--p-accent) 78%,#fff),var(--p-accent));color:var(--p-on);border-radius:6px;padding:10px 14px;font-weight:600;font-size:12px}
.screen .gold:active{transform:scale(.97)}
.screen .outl{border:1px solid var(--p-accent);color:var(--p-accent);border-radius:5px;padding:7px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}

.sect{padding:18px 14px 2px;text-align:center}
.sect>svg{color:var(--p-accent)}
.orn{display:flex;align-items:center;gap:10px;color:var(--p-accent);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:var(--p-gline)}
.sect p{font-size:11px;color:var(--p-mute);margin-top:6px}
.cards{padding:10px 14px 6px;scroll-snap-type:x proximity}
.svc{flex:none;width:116px;background:var(--p-card);border:1px solid var(--p-gline);border-radius:10px;padding:14px 8px 10px;text-align:center;display:grid;gap:4px;justify-items:center;align-content:start;scroll-snap-align:start}
.svc>svg{color:var(--p-accent)}
.svc strong{font-size:12.5px;line-height:1.15;font-weight:600}
.pr{color:var(--p-accent);font-weight:700;font-variant-numeric:tabular-nums}
.svc .pr{font-size:17px}
.svc .pr small{font-size:10px;font-weight:500}
.svc .ds{font-size:10.5px;color:var(--p-mute);line-height:1.3;min-height:2.6em}
.screen .svc .outl{margin-top:4px}
.screen button.svc[aria-pressed="true"]{border:1.5px solid var(--p-accent);background:color-mix(in srgb,var(--p-accent) 12%,var(--p-card))}
.screen button.svc{padding:14px 8px 10px;background:var(--p-card);border:1px solid var(--p-line)}
.stepper{display:flex;align-items:center;gap:8px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px}
.screen .stepper button{width:24px;height:24px;border-radius:50%;background:var(--p-accent);color:var(--p-on);font-weight:700;line-height:1}

.featrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 14px;padding:12px 0;border-top:1px solid var(--p-line);border-bottom:1px solid var(--p-line)}
.featrow div{padding:0 5px;text-align:center;border-left:1px solid var(--p-gline);display:grid;gap:3px;justify-items:center;align-content:start}
.featrow div:first-child{border-left:0}
.featrow svg{color:var(--p-accent)}
.featrow strong{font-size:10.5px;line-height:1.2;font-weight:600}
.featrow span{font-size:9.5px;color:var(--p-mute);line-height:1.25}
.about{display:grid;grid-template-columns:minmax(0,1fr) 98px;gap:10px;padding:8px 14px 10px;align-items:center}
.ttl{font-family:var(--serif);color:var(--p-accent);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px;font-weight:600}
.about p{font-size:11.5px;margin-bottom:8px}
.im{border-radius:8px;background:var(--p-hero) center/cover;display:grid;place-items:center;color:#fff}
.about .im{height:124px}
.ready{margin:8px 14px;background:var(--p-card);border:1px solid var(--p-line);border-radius:10px;padding:14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px}
.ready>svg{color:var(--p-accent)}
.ready strong{font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.ready p{font-size:11px;color:var(--p-mute);margin:2px 0 10px}
.psec{padding:12px 14px}
.gal .im{flex:none;width:132px;height:100px}
.pinfo{background:var(--p-card);border:1px solid var(--p-line);border-radius:10px;padding:12px;display:grid;gap:10px;font-size:12px}
.pinfo div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.pinfo svg{color:var(--p-accent)}
.pinfo small{display:block;color:var(--p-mute);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em}
.screen .wa{width:100%;background:#1FA855;color:#fff;border-radius:8px;padding:11px;font-weight:600;font-size:12.5px;margin-top:10px}
.pfoot{text-align:center;color:var(--p-mute);font-size:10px;padding:6px 14px 18px}
.screen .cartbar{margin:0 10px 8px;width:calc(100% - 20px);background:var(--p-accent);color:var(--p-on);border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:600;font-size:12.5px;animation:rise .3s both}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--p-line);background:var(--p-bg);padding:7px 4px 12px}
.screen .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;color:var(--p-mute)}
.screen .tabbar button.on{color:var(--p-accent)}

/* telas internas */
.vhead{display:flex;align-items:center;padding:8px 10px 12px;border-bottom:1px solid var(--p-gline)}
.vhead h4{flex:1;text-align:center;margin:0 30px 0 0;font-family:var(--serif);color:var(--p-accent);font-size:18px;font-weight:600}
.screen .vhead button{width:30px;height:30px;display:grid;place-items:center}
.step{font-size:12.5px;color:var(--p-accent);font-weight:600;margin:14px 14px 8px}
.cards.tight{padding-top:0;padding-bottom:0}
.pros{padding:2px 14px}
.screen .pro{flex:none;width:60px;text-align:center;font-size:11px}
.pro .av{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--p-line);background:var(--p-card);display:grid;place-items:center;margin:2px auto 4px;font-family:var(--serif);font-size:18px;color:var(--p-accent)}
.pro[aria-pressed="true"] .av{border-color:var(--p-accent);box-shadow:0 0 0 2px var(--p-bg),0 0 0 3.5px var(--p-accent)}
.pro small{display:block;color:var(--p-mute);font-size:9.5px}
.cal{margin:0 14px;background:var(--p-card);border:1px solid var(--p-line);border-radius:10px;padding:10px 6px}
.cal .mh{display:flex;justify-content:space-between;align-items:center;color:var(--p-accent);font-weight:600;font-size:13px;padding:0 4px 6px;text-transform:capitalize}
.screen .cal .mh button{width:26px;height:26px;display:grid;place-items:center;color:var(--p-ink)}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11.5px;row-gap:2px}
.cal .g span{color:var(--p-mute);font-size:10px;padding:2px 0}
.screen .cal .g button{width:27px;height:27px;border-radius:50%;margin:0 auto;font-variant-numeric:tabular-nums}
.screen .cal button:disabled{opacity:.28;cursor:default}
.screen .cal .g button[aria-pressed="true"]{background:var(--p-accent);color:var(--p-on);font-weight:700}
.times{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 14px}
.times.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.screen .times button{border:1px solid var(--p-gline);border-radius:7px;padding:8px 2px;font-size:11.5px;color:var(--p-accent);font-weight:600;background:var(--p-card);font-variant-numeric:tabular-nums}
.screen .times button:disabled{border-color:var(--p-line);color:var(--p-mute);opacity:.5;cursor:default}
.screen .times button[aria-pressed="true"]{background:var(--p-accent);color:var(--p-on)}
.screen .bigbtn{margin:16px 14px 18px;width:calc(100% - 28px);justify-content:space-between;padding:13px 14px;font-size:13.5px;border-radius:8px}
.screen .bigbtn:disabled{opacity:.4;cursor:not-allowed}
.bigbtn span{display:flex;align-items:center;gap:10px}
.line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--p-line);margin:0 14px}
.line div:first-child{flex:1;min-width:0}
.line .stepper{margin:0}
.total{display:flex;justify-content:space-between;font-weight:700;padding:12px 14px 0;font-size:14px}
.empty{padding:30px 20px;text-align:center;color:var(--p-mute)}

.done{padding:22px 14px 0;text-align:center}
.okc{width:62px;height:62px;border-radius:50%;border:2px solid var(--p-accent);color:var(--p-accent);display:grid;place-items:center;margin:0 auto 12px;animation:okin .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes okin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.done h4{font-family:var(--serif);font-size:23px;line-height:1.1;margin:0 0 6px;font-weight:600}
.done>p{font-size:11.5px;color:var(--p-mute);margin-bottom:14px}
.rows{background:var(--p-card);border:1px solid var(--p-line);border-radius:10px;padding:2px 12px;text-align:left}
.rows div{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--p-line);font-size:12.5px}
.rows div:last-child{border-bottom:0}
.rows svg{color:var(--p-accent)}
.rows small{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--p-mute)}
.wac{margin-top:10px;background:var(--p-card);border:1px solid var(--p-line);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;font-size:11px;color:var(--p-mute);align-items:center}
.wac i{width:34px;height:34px;border-radius:50%;background:#1FA855;color:#fff;display:grid;place-items:center}
.wac strong{display:block;color:#35C46B;font-size:12.5px}
.screen .done .bigbtn{margin:14px 0 6px;width:100%}
.screen .lnk{color:var(--p-accent);font-size:12px;padding:8px;margin-bottom:14px}

.pmenu{position:absolute;inset:0;background:var(--p-bg);z-index:6;padding:50px 22px 20px;display:flex;flex-direction:column;gap:4px;animation:pop .2s}
.screen .pmenu button{text-align:left;font-family:var(--serif);font-size:22px;padding:11px 0;border-bottom:1px solid var(--p-line)}
.screen .pmenu .x{position:absolute;top:14px;right:16px;border:0;font-size:24px;padding:4px 8px;color:var(--p-accent)}
.toast{position:absolute;left:12px;right:12px;bottom:74px;background:var(--p-ink);color:var(--p-bg);border-radius:10px;padding:10px 12px;font-size:12px;text-align:center;z-index:7;animation:rise .25s both}

/* seções da agência */
.band{border-top:1px solid var(--line);padding-block:64px}
.band h2{font-weight:600;font-size:clamp(1.6rem,3.4vw,2.3rem);max-width:18em}
.band .intro{color:var(--mute);max-width:36em;margin-top:12px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:36px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid var(--ink);padding-top:16px}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:600;font-size:1.6rem;display:block;margin-bottom:6px;background:linear-gradient(120deg,var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.steps h3{font-size:1.15rem;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.steps p,.feats p{color:var(--mute);font-size:.95rem}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 32px;margin-top:36px}
.feats h3{font-size:1.02rem;font-weight:600;margin-bottom:4px;letter-spacing:-.01em}
.ask{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:start}
.form{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px;display:grid;gap:16px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;align-items:center;gap:8px;font-size:.93rem;font-weight:400;margin:0}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--danger);font-size:.9rem}
.summary textarea{min-height:190px;font-size:.92rem;line-height:1.5;resize:vertical}
footer{border-top:1px solid var(--line);padding-block:32px 40px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
footer p{color:var(--mute);font-size:.9rem}

@media (max-width:880px){
  .hero,.ask{grid-template-columns:minmax(0,1fr);gap:40px}
  .steps,.feats{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .nav a:not(.btn){display:none}
  .band{padding-block:48px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useRef, useEffect } = React;
const html = htm.bind(React.createElement);

/* ---------- Ícones (traço, 24x24) ---------- */
const c = (x, y, r) => `M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`;

function Calendar({ value, onChange }) {
  const [ym, setYm] = useState(() => new Date(TODAY.getFullYear(), TODAY.getMonth(), 1));
  const first = new Date(ym.getFullYear(), ym.getMonth(), 1 - ym.getDay());
  const weeks = Math.ceil((ym.getDay() + new Date(ym.getFullYear(), ym.getMonth() + 1, 0).getDate()) / 7);
  const cells = Array.from({ length: weeks * 7 }, (_, i) => new Date(first.getFullYear(), first.getMonth(), first.getDate() + i));
  const move = (n) => setYm(new Date(ym.getFullYear(), ym.getMonth() + n, 1));
  const atStart = ym.getFullYear() === TODAY.getFullYear() && ym.getMonth() === TODAY.getMonth();
  return html`<div className="cal">
    <div className="mh"><button aria-label="Mês anterior" disabled=${atStart} onClick=${() => move(-1)}><${Ico} n="back" s=${15} /></button>
      <span>${ym.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }).replace(' de ', ' ')}</span>
      <button aria-label="Próximo mês" onClick=${() => move(1)}><${Ico} n="fwd" s=${15} /></button></div>
    <div className="g">${['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((d) => html`<span key=${d}>${d}</span>`)}
      ${cells.map((d) => html`<button key=${d.getTime()} disabled=${d.getMonth() !== ym.getMonth() || d < TODAY || d.getDay() === 0}
        aria-pressed=${!!value && d.getTime() === value.getTime()} onClick=${() => onChange(d)}>${d.getDate()}</button>`)}</div>
  </div>`;
}

/* ---------- O celular ---------- */
function Phone({ seg, name, photo }) {
  const shown = name.trim() || seg.fallback;
  const isCart = seg.mode === 'pedido';
  const [view, setView] = useState('home');
  const [svc, setSvc] = useState(0);
  const [pro, setPro] = useState(0);

  const [time, setTime] = useState(null);
  const [cart, setCart] = useState({});
  const [recv, setRecv] = useState(0);
  const [done, setDone] = useState(null);
  const [menu, setMenu] = useState(false);
  const [toast, setToast] = useState('');
  const scroller = useRef(null);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(''), 2200); return () => clearTimeout(t); }, [toast]);

  const go = (sec) => {
    setMenu(false); setView('home');
    setTimeout(() => {
      const box = scroller.current, el = box && box.querySelector(`[data-sec="${sec}"]`);

  };
  const openBook = (i) => { setMenu(false); setSvc(i || 0); setDate(null); setTime(null); setView('book'); };
  const openMain = () => { setMenu(false); isCart ? setView('cart') : openBook(0); };
  const add = (i, n) => setCart((o) => { const q = Math.max(0, (o[i] || 0) + n), r = { ...o }; if (q) r[i] = q; else delete r[i]; return r; });
  const count = Object.values(cart).reduce((a, b) => a + b, 0);
  const total = Object.entries(cart).reduce((a, [i, q]) => a + seg.items[i][2] * q, 0);
  const pros = seg.pro ? ['Qualquer', ...seg.pro[1]] : null;

  const confirmBook = () => {
    const it = seg.items[svc];
    setDone({ title: 'Agendamento Confirmado!', sub: 'Seu horário foi agendado com sucesso.', wa: ['Lembrete via WhatsApp', 'Enviaremos um lembrete 2 horas antes do seu horário.'], btn: 'Ver na agenda',
      rows: [['cal', 'Data', date.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }), cap(date.toLocaleDateString('pt-BR', { weekday: 'long' }))],
        ['clock', 'Horário', time], [it[3], 'Serviço', it[0], money(it[2]) + (it[4] || '')],
        ...(pros ? [['user', 'Profissional', pro === 0 ? 'Primeiro disponível' : pros[pro]]] : [])] });
    setView('done');
  };
  const confirmCart = () => {
    setDone({ title: 'Pedido Confirmado!', sub: 'Recebemos seu pedido e já estamos preparando.', wa: ['Acompanhe pelo WhatsApp', 'Avisaremos assim que seu pedido estiver pronto.'], btn: 'Acompanhar pedido',
      rows: [['bag', 'Itens', Object.entries(cart).map(([i, q]) => q + '× ' + seg.items[i][0]).join(', ')], ['card', 'Total', brl.format(total)], ['pin', 'Recebimento', seg.recv[recv]]] });
    setCart({}); setView('done');
  };

  const p = seg.pal, hbg = p.hero || p.bg;
  const style = { '--p-bg': p.bg, '--p-card': p.card, '--p-ink': p.ink || '#F5F1EA', '--p-accent': p.ac, '--p-hacc': p.ink ? p.ac2 : p.ac, '--p-ac2': p.ac2, '--p-on': p.on || '#15120A', '--p-hbg': hbg, '--p-glow': p.glow || p.ac2, '--p-hero': `linear-gradient(160deg, ${p.ac2}, ${p.ac})` };
  const ph = (n) => 'img/' + seg.id + (n ? '-' + n : '') + '.jpg';
  const heroImg = photo
    ? { backgroundImage: `linear-gradient(90deg, rgba(0,0,0,.86), rgba(0,0,0,.2)), url(${photo})`, backgroundSize: 'cover', backgroundPosition: 'center' }
    : { backgroundImage: `linear-gradient(90deg, ${hbg} 0%, ${hbg} 22%, transparent 70%), url(${ph()})`, backgroundSize: '100% 100%, auto 100%', backgroundPosition: '0 0, right center' };
  const img1 = photo || ph(2);
  const im = (src, icon) => html`<div className="im" style=${src ? { backgroundImage: `url(${src})` } : null}>${!src && html`<${Ico} n=${icon} s=${30} />`}</div>`;
  const price = (it) => html`<span className="pr">${money(it[2])}${it[4] && html`<small>${it[4]}</small>`}</span>`;

  const home = html`<div className="pscroll" ref=${scroller} key="home">
    <div className="hero2" style=${heroImg}>
      <h4>${seg.head[0]}<span>${seg.head[1]}</span></h4><p>${seg.sub}</p>
      <button className="gold" onClick=${() => isCart ? go('itens') : openBook(0)}>${seg.cta}<${Ico} n="arrow" s=${15} /></button>
    </div>

    <div className="sect" data-sec="itens"><${Ico} n=${seg.ico} s=${24} /><div className="orn">${seg.svcTitle}</div><p>${seg.svcSub}</p></div>
    <div className="hsc cards stag">${seg.items.map((it, i) => html`<div className="svc" key=${i} style=${{ '--i': i }}>
      <${Ico} n=${it[3]} s=${32} /><strong>${it[0]}</strong>${price(it)}<span className="ds">${it[1]}</span>
      ${isCart
        ? (cart[i] ? html`<div className="stepper"><button aria-label="Remover um" onClick=${() => add(i, -1)}>−</button>${cart[i]}<button aria-label="Adicionar mais um" onClick=${() => add(i, 1)}>+</button></div>`
          : html`<button className="outl" onClick=${() => add(i, 1)}>Adicionar</button>`)
        : html`<button className="outl" onClick=${() => openBook(i)}>Agendar</button>`}

    <div className="featrow">${seg.feats.map((f) => html`<div key=${f[1]}><${Ico} n=${f[0]} s=${24} /><strong>${f[1]}</strong><span>${f[2]}</span></div>`)}</div>

    <div className="about"><div><h5 className="ttl">Sobre nós</h5><p>${seg.about}</p><button className="outl" onClick=${() => go('contato')}>Venha conhecer</button></div>${im(img1, seg.ico)}</div>

    <div className="ready"><${Ico} n=${isCart ? 'bag' : 'cal'} s=${28} /><div><strong>${isCart ? 'Pronto para pedir?' : 'Pronto para agendar?'}</strong>
      <p>${isCart ? 'Monte seu pedido em poucos toques.' : 'Escolha o melhor dia e horário para você.'}</p>
      <button className="gold" onClick=${() => isCart ? go('itens') : openBook(0)}>${isCart ? 'Fazer pedido' : 'Fazer agendamento'}</button></div></div>

    <div className="psec" data-sec="galeria"><h5 className="ttl">Galeria</h5>
      <div className="hsc gal">${photo && im(photo, 'photo')}${im(ph(2), seg.ico)}${im(ph(3), seg.ico)}${im(ph(), seg.ico)}</div></div>

    <div className="psec" data-sec="contato"><h5 className="ttl">Contato</h5>
      <div className="pinfo"><div><${Ico} n="clock" s=${22} /><span><small>Horário</small>${seg.hours}</span></div>
        <div><${Ico} n="pin" s=${22} /><span><small>Endereço</small>Seu endereço, com mapa e rota</span></div></div>
      <button className="wa" onClick=${() => setToast('Aqui abre o WhatsApp do seu negócio')}>Chamar no WhatsApp</button></div>
    <div className="pfoot">${shown} · site por AJ STUDIO</div>
  </div>`;

  const book = html`<div className="pscroll" key="book">
    <div className="vhead"><button aria-label="Voltar" onClick=${() => setView('home')}><${Ico} n="back" s=${20} /></button><h4>${seg.cta.startsWith('Agendar') ? 'Agendar Horário' : seg.cta}</h4></div>
    <div className="step">1. Escolha o serviço</div>
    <div className="hsc cards tight">${seg.items.map((it, i) => html`<button className="svc" key=${i} aria-pressed=${svc === i} onClick=${() => setSvc(i)}>
      <${Ico} n=${it[3]} s=${28} /><strong>${it[0]}</strong>${price(it)}</button>`)}</div>
    ${pros && html`<div><div className="step">2. ${seg.pro[0]}</div>
      <div className="hsc pros">${pros.map((n, i) => html`<button className="pro" key=${n} aria-pressed=${pro === i} onClick=${() => setPro(i)}>
        <span className="av">${i === 0 ? html`<${Ico} n="users" s=${22} />` : n.replace(/^Dra?\. /, '')[0]}</span>${n}<small>Disponível</small></button>`)}</div></div>`}
    <div className="step">${pros ? '3. ' : '2. '}Selecione a data</div>
    <${Calendar} value=${date} onChange=${setDate} />
    <div className="step">Horários disponíveis</div>
    <div className="times">${TIMES.map((t, i) => html`<button key=${t} disabled=${i > 7} aria-pressed=${time === t} onClick=${() => setTime(t)}>${t}</button>`)}</div>
    <button className="gold bigbtn" disabled=${!date || !time} onClick=${confirmBook}><span><${Ico} n="cal" s=${20} />Confirmar Agendamento</span><${Ico} n="fwd" s=${16} /></button>
  </div>`;

  const cartView = html`<div className="pscroll" key="cart">
    <div className="vhead"><button aria-label="Voltar" onClick=${() => setView('home')}><${Ico} n="back" s=${20} /></button><h4>Seu Pedido</h4></div>
    ${count === 0 ? html`<div className="empty"><${Ico} n="bag" s=${40} /><p>Seu pedido está vazio.<br />Toque em “Adicionar” em qualquer item.</p></div>` : html`<div>
      ${Object.entries(cart).map(([i, q]) => html`<div className="line" key=${i}>
        <div><strong>${seg.items[i][0]}</strong><br /><span className="pr">${brl.format(seg.items[i][2] * q)}</span></div>
        <div className="stepper"><button aria-label="Remover um" onClick=${() => add(i, -1)}>−</button>${q}<button aria-label="Adicionar mais um" onClick=${() => add(i, 1)}>+</button></div></div>`)}
      <div className="step">Como prefere receber?</div>
      <div className="times two">${seg.recv.map((r, i) => html`<button key=${r} aria-pressed=${recv === i} onClick=${() => setRecv(i)}>${r}</button>`)}</div>
      <div className="total"><span>Total</span><span className="pr">${brl.format(total)}</span></div>
      <button className="gold bigbtn" onClick=${confirmCart}><span><${Ico} n="check" s=${20} />Confirmar Pedido</span><${Ico} n="fwd" s=${16} /></button></div>`}
  </div>`;

  const doneView = done && html`<div className="pscroll" key="done"><div className="done">
    <div className="okc"><${Ico} n="check" s=${32} /></div><h4>${done.title}</h4><p>${done.sub}</p>
    <div className="rows stag">${done.rows.map((r, i) => html`<div key=${r[1]} style=${{ '--i': i }}><${Ico} n=${r[0]} s=${24} /><span><small>${r[1]}</small>${r[2]}${r[3] && html`<br />${r[3]}`}</span></div>`)}</div>

    <button className="lnk" onClick=${() => go('topo')}>Voltar ao Início</button>

  return html`

      ${view === 'home' ? home : view === 'book' ? book : view === 'cart' ? cartView : doneView}

      ${view === 'home' && isCart && count > 0 && html`<button className="cartbar" onClick=${() => setView('cart')}><span>Ver pedido · ${count} ${count === 1 ? 'item' : 'itens'}</span><span>${brl.format(total)}</span></button>`}

      ${view === 'home' && html`<div className="tabbar">
        <button className="on" onClick=${() => go('topo')}><${Ico} n="home" />Início</button>

        <button onClick=${openMain}><${Ico} n=${isCart ? 'bag' : 'cal'} />${isCart ? 'Pedido' + (count ? ' (' + count + ')' : '') : 'Agendar'}</button>

        <button onClick=${() => go('contato')}><${Ico} n="chat" />Contato</button>
      </div>`}

      ${toast && html`<div className="toast" role="status">${toast}</div>`}

      ${menu && html`<div className="pmenu">
        <button className="x" aria-label="Fechar menu" onClick=${() => setMenu(false)}>×</button>
        <button onClick=${() => go('topo')}>Início</button>

        <button onClick=${openMain}>${isCart ? 'Meu pedido' : 'Agendar horário'}</button>
        <button onClick=${() => go('galeria')}>Galeria</button>
        <button onClick=${() => go('contato')}>Contato</button>
      </div>`}
    </div>
  </div>`;
}

const WANTS = ['Agendamento online', 'Cardápio ou catálogo', 'Botão de WhatsApp', 'Mapa e horário', 'Galeria de fotos', 'Logo e identidade visual'];

function App() {
  const [name, setName] = useState('');

  const [notes, setNotes] = useState('');
  const [error, setError] = useState('');
  const [summary, setSummary] = useState('');
  const [copied, setCopied] = useState(false);
  const sumRef = useRef(null), fileRef = useRef(null);

  const pick = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader(); r.onload = () => setPhoto(r.result); r.readAsDataURL(f);
  };
  const dropPhoto = () => { setPhoto(''); if (fileRef.current) fileRef.current.value = ''; };
  const toggle = (w) => setWants((a) => a.includes(w) ? a.filter((x) => x !== w) : [...a, w]);
  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return setError('Diga o nome do seu estabelecimento.');
    if (phone.replace(/\D/g, '').length < 10) return setError('Informe um WhatsApp com DDD para a gente responder.');

      'Pedido de site para a AJ STUDIO', '',

      'Contato: ' + (contact.trim() || 'não informado'), 'WhatsApp: ' + phone.trim(),

      notes.trim() ? 'Observações: ' + notes.trim() : null,
    ].filter((l) => l !== null).join('\n'));
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(summary); setCopied(true); }

  };

          <div className="actions"><button className="btn" type="button" onClick=${copy}>${copied ? 'Copiado' : 'Copiar pedido'}</button><span className="note">Copie e envie para a AJ STUDIO pelo WhatsApp.</span></div>
        </div>`}
      </div>
    </div></section>
  </main>

  <footer><div className="wrap">
    <a className="brand" href="#simulador"><${Logo} size=${36} /><span><b>AJ STUDIO</b><small>Branding & Web Design</small></span></a>
    <p>Um novo olhar transforma seu negócio.</p>
  </div></footer>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
